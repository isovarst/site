
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORK7</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#000;color:#fff;font-family:"Comic Sans MS",cursive;display:flex;align-items:center;justify-content:center;overflow-x:hidden}
.container{width:90%;max-width:360px;text-align:center;z-index:2}
h1{font-size:30px;font-weight:normal;margin:0 0 8px}
.subtitle{font-size:13px;color:#888;margin-bottom:35px}
#status{font-size:13px;margin-bottom:14px}
.progress-container{width:100%;height:7px;background:#292929;overflow:hidden;border-radius:20px}
#progressBar{width:0%;height:100%;background:#fff;border-radius:20px;transition:width .15s ease}
#progressText{font-size:12px;color:#888;margin-top:10px;line-height:1.8}
#eta{font-size:11px;color:#666;margin-top:3px}
button{display:none;width:100%;padding:12px;margin-top:25px;background:white;color:black;border:none;font-family:"Comic Sans MS",cursive;font-size:14px;cursor:pointer}
button:hover{background:#ccc}
#error{color:#f44;font-size:12px;margin-top:15px;overflow-wrap:anywhere}
.credit{position:fixed;bottom:18px;left:0;width:100%;text-align:center;font-size:11px;color:#666}
#debug{position:fixed;left:18px;top:50%;transform:translateY(-50%);width:270px;height:340px;background:#080808;border:1px solid #252525;padding:12px;display:flex;flex-direction:column;text-align:left;z-index:5}
.debug-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #252525;padding-bottom:9px;margin-bottom:9px}
.debug-title{font-size:12px;color:#aaa}
#copyLogs{display:block;width:auto;margin:0;padding:5px 9px;font-size:10px;background:#222;color:#ddd;border:1px solid #333}
#copyLogs:hover{background:#333}
#logs{flex:1;overflow-y:auto;overflow-x:hidden;font-family:monospace;font-size:10px;line-height:1.7;scrollbar-width:thin;scrollbar-color:#333 transparent}
.log{color:#999;overflow-wrap:anywhere;animation:fadeLog 8s forwards}
.log.error{color:#ff4545}
.log.success{color:#ddd}
.log.warning{color:#aaa}
@keyframes fadeLog{0%{opacity:0}10%{opacity:1}75%{opacity:1}100%{opacity:.45}}
@media(max-width:850px){body{align-items:flex-start;padding-top:90px;padding-bottom:380px}#debug{top:auto;bottom:55px;left:5%;width:90%;height:240px;transform:none}.container{max-width:360px}}
</style>
</head>
<body>
<div class="container">
<h1>CORK7</h1>
<div class="subtitle">game loader</div>
<div id="status">Preparing download...</div>
<div class="progress-container"><div id="progressBar"></div></div>
<div id="progressText">Connecting...</div>
<div id="eta">Calculating download time...</div>
<button id="loadButton">Load CORK7</button>
<div id="error"></div>
</div>
<div id="debug">
<div class="debug-header">
<div class="debug-title">DEBUG CONSOLE</div>
<button id="copyLogs">Copy logs</button>
</div>
<div id="logs"></div>
</div>
<div class="credit">port by holdy (the goat)</div>
<script>

const WORKER_URL="https://cork7parts.holdenfernandesss.workers.dev";
const TOTAL_PARTS=61;
const CONCURRENCY=20;
const MAX_ATTEMPTS=8;
const BASE_RETRY_DELAY=250;
const MAX_RETRY_DELAY=8000;
const status=document.getElementById("status");
const bar=document.getElementById("progressBar");
const progressText=document.getElementById("progressText");
const eta=document.getElementById("eta");
const button=document.getElementById("loadButton");
const errorBox=document.getElementById("error");
const logs=document.getElementById("logs");
const copyButton=document.getElementById("copyLogs");
let gameBlob=null,logHistory=[],startTime=0,completedParts=0,downloadedBytes=0,averageSpeed=0,lastSampleBytes=0,lastSampleTime=0,displayedPercent=0,estimatedTotal=0,downloading=false;
const loaded=new Array(TOTAL_PARTS).fill(0);
const sizes=new Array(TOTAL_PARTS).fill(0);
const sizeKnown=new Array(TOTAL_PARTS).fill(false);
const parts=new Array(TOTAL_PARTS);
function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
function formatBytes(n){
if(n<1024)return n.toFixed(0)+" B";
if(n<1048576)return(n/1024).toFixed(1)+" KB";
if(n<1073741824)return(n/1048576).toFixed(2)+" MB";
return(n/1073741824).toFixed(2)+" GB";
}
function formatTime(n){
if(!isFinite(n)||n<0)return"Calculating...";
n=Math.ceil(n);
const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;
return h>0?h+"h "+m+"m "+s+"s":m>0?m+"m "+s+"s":s+"s";
}
function log(message,type="normal"){
const entry="["+new Date().toLocaleTimeString()+"] "+message;
logHistory.push(entry);
const el=document.createElement("div");
el.className="log "+type;
el.textContent=entry;
logs.appendChild(el);
while(logs.children.length>150)logs.removeChild(logs.firstChild);
logs.scrollTop=logs.scrollHeight;
}
copyButton.addEventListener("click",async()=>{
try{await navigator.clipboard.writeText(logHistory.join("\n"))}
catch(e){
const t=document.createElement("textarea");
t.value=logHistory.join("\n");
document.body.appendChild(t);
t.select();
document.execCommand("copy");
t.remove();
}
copyButton.textContent="Copied!";
setTimeout(()=>copyButton.textContent="Copy logs",1500);
});
function partURL(n){return WORKER_URL.replace(/\/$/,"")+"/part"+n}
function calculateTotal(){
const known=[];
for(let i=0;i<TOTAL_PARTS;i++){
if(sizeKnown[i]&&sizes[i]>0)known.push(sizes[i]);
else if(parts[i]&&sizes[i]>0)known.push(sizes[i]);
}
if(known.length===TOTAL_PARTS){
estimatedTotal=known.reduce((a,b)=>a+b,0);
return;
}
if(known.length>=3){
const average=known.reduce((a,b)=>a+b,0)/known.length;
estimatedTotal=average*TOTAL_PARTS;
}else if(known.length>0){
estimatedTotal=Math.max(estimatedTotal,known.reduce((a,b)=>a+b,0)/known.length*TOTAL_PARTS);
}
}
function updateProgress(){
downloadedBytes=loaded.reduce((a,b)=>a+b,0);
calculateTotal();
const now=Date.now();
const dt=(now-lastSampleTime)/1000;
if(dt>=0.75){
const instant=Math.max(0,(downloadedBytes-lastSampleBytes)/dt);
averageSpeed=averageSpeed===0?instant:averageSpeed*.8+instant*.2;
lastSampleBytes=downloadedBytes;
lastSampleTime=now;
}
let target=estimatedTotal>0?downloadedBytes/estimatedTotal*100:0;
target=Math.min(99.5,Math.max(0,target));
displayedPercent=Math.max(displayedPercent,target);
if(completedParts===TOTAL_PARTS)displayedPercent=100;
bar.style.width=displayedPercent.toFixed(2)+"%";
const remaining=averageSpeed>0&&estimatedTotal>0?Math.max(0,estimatedTotal-downloadedBytes)/averageSpeed:NaN;
progressText.textContent=displayedPercent.toFixed(1)+"% · "+formatBytes(downloadedBytes)+(estimatedTotal>0?" / ~"+formatBytes(estimatedTotal):"") +" · "+completedParts+"/"+TOTAL_PARTS+" parts";
eta.textContent="Speed: "+formatBytes(averageSpeed)+"/s · ETA: "+formatTime(remaining);
}
async function downloadPart(number){
const i=number-1;
let lastError;
for(let attempt=1;attempt<=MAX_ATTEMPTS;attempt++){
let reader=null;
try{
log("Part "+number+" · Attempt "+attempt+"/"+MAX_ATTEMPTS);
const response=await fetch(partURL(number),{method:"GET",cache:"no-store"});
if(!response.ok)throw new Error("HTTP "+response.status);
if(!response.body)throw new Error("No response body");
const length=Number(response.headers.get("Content-Length"));
if(length>0){
sizes[i]=length;
sizeKnown[i]=true;
}
updateProgress();
reader=response.body.getReader();
const chunks=[];
let size=0;
while(true){
const result=await reader.read();
if(result.done)break;
chunks.push(result.value);
size+=result.value.byteLength;
loaded[i]=size;
updateProgress();
}
if(size===0)throw new Error("Empty part");
if(length>0&&size!==length)throw new Error("Incomplete part: "+size+"/"+length);
sizes[i]=size;
sizeKnown[i]=true;
loaded[i]=size;
parts[i]=new Blob(chunks);
completedParts++;
log("Part "+number+" complete · "+formatBytes(size),"success");
updateProgress();
return;
}catch(error){
if(reader){try{await reader.cancel()}catch(e){}}
loaded[i]=0;
sizes[i]=0;
sizeKnown[i]=false;
lastError=error;
updateProgress();
if(attempt===MAX_ATTEMPTS)break;
const delay=Math.min(MAX_RETRY_DELAY,BASE_RETRY_DELAY*Math.pow(2,attempt-1));
log("Part "+number+" failed: "+error.message+" · Retry in "+delay+"ms","warning");
await sleep(delay);
}
}
throw new Error("Part "+number+" failed: "+lastError.message);
}
async function validateGame(){
log("Validating HTML...");
const first=await parts[0].slice(0,512).text();
if(!/^\s*(?:<!doctype|<html)/i.test(first))throw new Error("Invalid first part");
const last=await parts[TOTAL_PARTS-1].slice(-2048).text();
if(!/<\/html>\s*$/i.test(last))throw new Error("Last part incomplete");
log("Validation successful","success");
}
async function downloadGame(){
if(downloading)return;
downloading=true;
gameBlob=null;
button.style.display="none";
errorBox.textContent="";
startTime=Date.now();
lastSampleTime=startTime;
lastSampleBytes=0;
averageSpeed=0;
completedParts=0;
downloadedBytes=0;
displayedPercent=0;
estimatedTotal=0;
loaded.fill(0);
sizes.fill(0);
sizeKnown.fill(false);
parts.fill(null);
bar.style.width="0%";
log("CORK7 initialized","success");
log("Starting "+CONCURRENCY+" continuous workers");
log("Total parts: "+TOTAL_PARTS);
log("Retry limit: "+MAX_ATTEMPTS);
let nextPart=1;
let failure=null;
async function worker(){
while(!failure){
const number=nextPart++;
if(number>TOTAL_PARTS)return;
try{
status.textContent="Downloading · "+completedParts+"/"+TOTAL_PARTS;
await downloadPart(number);
}catch(error){
failure=error;
log(error.message,"error");
}
}
}
try{
await Promise.all(Array.from({length:CONCURRENCY},()=>worker()));
if(failure)throw failure;
status.textContent="Validating CORK7...";
await validateGame();
status.textContent="Combining parts...";
gameBlob=new Blob(parts,{type:"text/html;charset=utf-8"});
displayedPercent=100;
bar.style.width="100%";
progressText.textContent="100% · "+formatBytes(gameBlob.size);
eta.textContent="Completed in "+formatTime((Date.now()-startTime)/1000);
status.textContent="CORK7 ready";
button.style.display="block";
log("Download successful · "+formatBytes(gameBlob.size),"success");
}catch(error){
status.textContent="Download failed";
errorBox.textContent=error.message;
eta.textContent="Download interrupted";
log("ERROR: "+error.message,"error");
console.error(error);
}finally{
downloading=false;
}
}
button.addEventListener("click",()=>{
if(!gameBlob)return;
log("Launching CORK7...","success");
const url=URL.createObjectURL(gameBlob);
window.location.href=url;
});
downloadGame();

</script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonvo Ski Ride</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        iframe {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <iframe
        src="https://bonvo.ski/en/ride/mayrhofen-hippach?play=free&utm_source=reddit&utm_medium=post&utm_campaign=playmygame"
        allow="fullscreen; autoplay; accelerometer; gyroscope; gamepad"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
</body>
</html>
